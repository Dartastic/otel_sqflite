name: otel_sqflite
description: OpenTelemetry instrumentation for `package:sqflite` /
  `package:sqflite_common`. Extension methods on DatabaseExecutor that
  wrap query / insert / update / delete / rawQuery with
  `db.system=sqlite` semconv spans.
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_sqflite
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  sqflite_common: ^2.5.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
